<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый запрос к API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            text-align: left;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h3 {
            margin-top: 0;
            color: #333;
        }
        
        .result pre {
            background-color: #eee;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .error {
            background-color: #ffebee;
            border-color: #f44336;
        }
        
        .loading {
            margin-top: 20px;
            color: #666;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Тестовый запрос к API</h1>
    <button id="sendRequestBtn">Отправить GET запрос</button>
    
    <div class="loading" id="loading">
        Загрузка...
    </div>
    
    <div class="result" id="result">
        <h3>Результат запроса:</h3>
        <pre id="resultContent"></pre>
    </div>

    <script>
        const sendButton = document.getElementById('sendRequestBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        
        sendButton.addEventListener('click', async () => {
            // Показываем индикатор загрузки
            loadingDiv.classList.add('show');
            resultDiv.classList.remove('show');
            sendButton.disabled = true;
            
            try {
                // Отправляем GET запрос
                const response = await fetch('https://api.bacbac.ru/identity/auth/test', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                // Получаем ответ в виде текста
                const resultText = await response.text();
                
                // Отображаем результат
                resultContent.textContent = resultText;
                resultDiv.classList.add('show');
                
                // Если статус не OK, добавляем класс ошибки
                if (!response.ok) {
                    resultDiv.classList.add('error');
                    resultContent.textContent = `Ошибка ${response.status}: ${response.statusText}\n\n${resultText}`;
                } else {
                    resultDiv.classList.remove('error');
                }
                
            } catch (error) {
                // Обрабатываем ошибки сети
                resultContent.textContent = `Ошибка при отправке запроса: ${error.message}\n\nПроверьте: \n- Доступность API\n- Настройки CORS\n- Подключение к интернету`;
                resultDiv.classList.add('show', 'error');
            } finally {
                // Скрываем индикатор загрузки и включаем кнопку
                loadingDiv.classList.remove('show');
                sendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
